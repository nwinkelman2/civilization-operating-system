services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: civos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: civos-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"
    restart: unless-stopped

  debezium:
    image: debezium/connect:3.0.0.Final
    container_name: civos-debezium
    depends_on:
      - kafka
      - postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: civos_debezium_config
      OFFSET_STORAGE_TOPIC: civos_debezium_offsets
      STATUS_STORAGE_TOPIC: civos_debezium_status
    ports:
      - "8083:8083"
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    container_name: civos-postgres
    environment:
      POSTGRES_DB: openciv
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civos-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: civos-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openciv
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      CIVILIZATION_SCALE: ${CIVILIZATION_SCALE:-LOCAL}
      CIVILIZATION_ADMIN_USER: ${CIVILIZATION_ADMIN_USER:-admin}
      CIVILIZATION_ADMIN_PASSWORD: ${CIVILIZATION_ADMIN_PASSWORD:-admin}
      LOG_PATH: ${LOG_PATH:-/var/log/civilization-os}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    restart: unless-stopped

  app-primary:
    build: .
    container_name: civos-app-primary
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openciv
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      CIVILIZATION_SCALE: ${CIVILIZATION_SCALE:-LOCAL}
      CIVILIZATION_ADMIN_USER: ${CIVILIZATION_ADMIN_USER:-admin}
      CIVILIZATION_ADMIN_PASSWORD: ${CIVILIZATION_ADMIN_PASSWORD:-admin}
      LOG_PATH: ${LOG_PATH:-/var/log/civilization-os}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8080"
    restart: unless-stopped

  cortex-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: civos-cortex-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openciv
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CIVOS_EVENTBUS_TYPE: kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WORKER_PORT: 9090
    ports:
      - "9090:9090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civos-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: civos-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - app-primary
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
