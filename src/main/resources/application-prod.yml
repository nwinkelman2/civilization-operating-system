spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  thymeleaf:
    cache: true

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Civilization Operating System
    version: 0.1.0-SNAPSHOT
    description: Resource-Based Economy Platform
