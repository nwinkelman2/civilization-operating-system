<div th:fragment="content">
    <header class="page-header">
        <h1 class="glitch-text" data-text="VOXTEX NEURAL MESH">
            <span class="glitch-scan">⟐</span> VOXTEX NEURAL MESH <span class="glitch-scan">⟐</span>
        </h1>
        <p class="subtitle">Real-Time Neural Network &bull; Mesh Topology &bull; Cross-Civilization Communication</p>
    </header>

    <div class="voxtex-layout">
        <!-- Status Bar -->
        <div class="voxtex-stats">
            <div class="voxtex-stat">
                <span class="vs-label">NODES</span>
                <span class="vs-value" th:text="${status.totalNodes}">0</span>
            </div>
            <div class="voxtex-stat">
                <span class="vs-label">ACTIVE</span>
                <span class="vs-value" style="color:#00ff88;" th:text="${status.activeNodes}">0</span>
            </div>
            <div class="voxtex-stat">
                <span class="vs-label">CONNECTIONS</span>
                <span class="vs-value" th:text="${status.totalConnections}">0</span>
            </div>
            <div class="voxtex-stat">
                <span class="vs-label">NETWORK</span>
                <span class="vs-value" th:text="${status.networkStatus}" th:classappend="${status.networkStatus == 'ONLINE'} ? 'status-online' : 'status-offline'">ONLINE</span>
            </div>
        </div>

        <div class="voxtex-content">
            <!-- Network Graph Canvas -->
            <div class="voxtex-canvas-container">
                <canvas id="voxtexCanvas"></canvas>
            </div>

            <!-- Message Log -->
            <div class="voxtex-sidebar">
                <h3>MESH MESSAGES</h3>
                <div class="voxtex-msg-log" id="msgLog">
                    <div th:if="${#lists.isEmpty(recentMessages)}" class="voxtex-msg voxtex-msg-sys">
                        Neural mesh initializing...
                    </div>
                    <div class="voxtex-msg" th:each="m : ${recentMessages}"
                         th:classappend="${m.delivered} ? 'voxtex-msg-delivered' : 'voxtex-msg-pending'">
                        <span class="msg-type" th:text="${m.messageType}">SYNC</span>
                        <span class="msg-text" th:text="${m.content}">Message</span>
                        <span class="msg-hops" th:if="${m.hopCount}" th:text="${m.hopCount} + ' hops'">0 hops</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas graph visualization using force-directed layout
        const canvas = document.getElementById('voxtexCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const nodes = /*[[${nodes}]]*/ [];
        const connections = /*[[${connections}]]*/ [];
        const nodePositions = {};

        // Initialize positions
        nodes.forEach((n, i) => {
            const angle = (2 * Math.PI * i) / nodes.length;
            const radius = Math.min(canvas.width, canvas.height) * 0.3;
            nodePositions[n.id] = {
                x: canvas.width / 2 + radius * Math.cos(angle),
                y: canvas.height / 2 + radius * Math.sin(angle),
                vx: 0, vy: 0
            };
        });

        const nodeColors = {
            'PRIMARY': '#00f2ff',
            'CITY': '#00ff88',
            'OUTPOST': '#ffd700',
            'MIGRANT': '#ff6b35'
        };

        function drawNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw connections
            connections.forEach(conn => {
                const a = nodePositions[conn.nodeA?.id || conn.nodeA];
                const b = nodePositions[conn.nodeB?.id || conn.nodeB];
                if (!a || !b) return;

                const strength = conn.strength || 0.3;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `rgba(0, 242, 255, ${strength * 0.4})`;
                ctx.lineWidth = strength * 3;
                ctx.stroke();

                // Animate pulse on active connections
                if (conn.messagesExchanged > 0) {
                    const t = Date.now() / 1000;
                    const pulseX = a.x + (b.x - a.x) * ((Math.sin(t + conn.id) + 1) / 2);
                    const pulseY = a.y + (b.y - a.y) * ((Math.sin(t + conn.id) + 1) / 2);
                    ctx.beginPath();
                    ctx.arc(pulseX, pulseY, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 242, 255, ${strength * 0.8})`;
                    ctx.fill();
                }
            });

            // Draw nodes
            nodes.forEach(n => {
                const pos = nodePositions[n.id];
                if (!pos) return;

                const color = nodeColors[n.type] || '#00f2ff';
                const radius = n.type === 'PRIMARY' ? 12 : (n.type === 'CITY' ? 8 : 5);

                // Glow
                const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, radius * 3);
                gradient.addColorStop(0, color + '40');
                gradient.addColorStop(1, color + '00');
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius * 3, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Node circle
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Label
                ctx.fillStyle = '#fff';
                ctx.font = '10px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(n.name, pos.x, pos.y - radius - 8);
            });

            // Simple force-directed tick
            nodes.forEach(n => {
                const pos = nodePositions[n.id];
                if (!pos) return;

                // Center gravity
                pos.vx += (centerX - pos.x) * 0.0005;
                pos.vy += (centerY - pos.y) * 0.0005;

                // Repulsion from other nodes
                nodes.forEach(other => {
                    if (other.id === n.id) return;
                    const op = nodePositions[other.id];
                    if (!op) return;
                    const dx = pos.x - op.x;
                    const dy = pos.y - op.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const force = 100 / (dist * dist);
                    pos.vx += (dx / dist) * force;
                    pos.vy += (dy / dist) * force;
                });

                // Damping
                pos.vx *= 0.9;
                pos.vy *= 0.9;
                pos.x += pos.vx;
                pos.y += pos.vy;
            });

            requestAnimationFrame(drawNetwork);
        }

        drawNetwork();

        // SSE stream for real-time messages
        const msgLog = document.getElementById('msgLog');
        if (window.EventSource) {
            const evtSource = new EventSource('/api/v1/voxtex/stream');
            evtSource.addEventListener('voxtex-message', function(e) {
                const msg = JSON.parse(e.data);
                const div = document.createElement('div');
                div.className = 'voxtex-msg voxtex-msg-delivered';
                div.innerHTML = `<span class="msg-type">${msg.messageType}</span>
                    <span class="msg-text">${msg.content}</span>
                    <span class="msg-hops">${msg.hopCount || 0} hops</span>`;
                msgLog.insertBefore(div, msgLog.firstChild);
                if (msgLog.children.length > 50) {
                    msgLog.removeChild(msgLog.lastChild);
                }
            });
            evtSource.onerror = function() {
                console.log('SSE disconnected, retrying...');
            };
        }

        // WebSocket for real-time messages
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = wsProtocol + '//' + window.location.host + '/ws/voxtex';
        let ws = new WebSocket(wsUrl);

        ws.onopen = () => console.log('WebSocket connected');
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'voxtex-message') {
                    const div = document.createElement('div');
                    div.className = 'voxtex-msg voxtex-msg-delivered';
                    div.innerHTML = `<span class="msg-type">${data.messageType}</span>
                        <span class="msg-text">${data.content}</span>
                        <span class="msg-hops">${data.hopCount || 0} hops</span>`;
                    msgLog.insertBefore(div, msgLog.firstChild);
                    if (msgLog.children.length > 50) {
                        msgLog.removeChild(msgLog.lastChild);
                    }
                }
            } catch (e) {}
        };
        ws.onclose = () => {
            console.log('WebSocket disconnected, reconnecting in 3s...');
            setTimeout(() => { ws = new WebSocket(wsUrl); }, 3000);
        };
    </script>

    <style>
        .voxtex-layout { display: flex; flex-direction: column; gap: 16px; }
        .voxtex-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .voxtex-stat { background: rgba(255,255,255,0.02); border: 1px solid rgba(0,242,255,0.1);
            border-radius: 8px; padding: 16px; text-align: center; }
        .vs-label { display: block; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 4px; }
        .vs-value { display: block; font-size: 1.2rem; font-weight: 700; color: var(--accent-cyan); }
        .status-online { color: #00ff88 !important; }
        .status-offline { color: #ff4444 !important; }
        .voxtex-content { display: flex; gap: 20px; }
        .voxtex-canvas-container { flex: 1; height: 500px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,242,255,0.1); border-radius: 8px; overflow: hidden; }
        #voxtexCanvas { width: 100%; height: 100%; }
        .voxtex-sidebar { width: 350px; flex-shrink: 0; }
        .voxtex-sidebar h3 { color: var(--accent-cyan); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 12px; }
        .voxtex-msg-log { display: flex; flex-direction: column; gap: 6px; max-height: 460px;
            overflow-y: auto; padding-right: 6px; }
        .voxtex-msg { padding: 8px; border-radius: 4px; font-size: 0.7rem;
            border-left: 2px solid rgba(0,242,255,0.3); background: rgba(255,255,255,0.02); }
        .voxtex-msg-delivered { border-left-color: #00ff88; }
        .voxtex-msg-pending { border-left-color: #ffd700; opacity: 0.7; }
        .voxtex-msg-sys { border-left-color: var(--text-dim); color: var(--text-dim); font-style: italic; }
        .msg-type { color: var(--accent-cyan); font-size: 0.6rem; display: block; }
        .msg-text { display: block; margin: 2px 0; }
        .msg-hops { font-size: 0.6rem; color: var(--text-dim); }
        @media (max-width: 900px) {
            .voxtex-content { flex-direction: column; }
            .voxtex-sidebar { width: 100%; }
            .voxtex-stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</div>
