<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Civilization Operating System — A Resource-Based Economy Platform">
    <title th:text="'Civilization OS | ' + ${pageTitle ?: 'Dashboard'}">Civilization OS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/auth.js}"></script>
</head>
<body>
    <nav class="nav-bar glass-morphism">
        <div class="nav-brand-group">
            <img th:src="@{/images/logo.svg}" alt="Logo" class="logo-small">
            <a th:href="@{/}" class="nav-brand glow-text">CIV:OS</a>
        </div>
        <div class="nav-links">
            <a th:href="@{/}" th:classappend="${#strings.equals(currentPage, 'dashboard')} ? 'active' : ''">Dashboard</a>
            <a th:href="@{/play}" th:classappend="${#strings.equals(currentPage, 'play')} ? 'active' : ''">Map</a>
            <a th:href="@{/civilizations}" th:classappend="${#strings.equals(currentPage, 'civilizations')} ? 'active' : ''">Civilizations</a>
            <a th:href="@{/leaderboard}" th:classappend="${#strings.equals(currentPage, 'leaderboard')} ? 'active' : ''">Leaderboard</a>
            <a th:href="@{/trade}" th:classappend="${#strings.equals(currentPage, 'trade')} ? 'active' : ''">Trade</a>
            <a th:href="@{/tech-tree}" th:classappend="${#strings.equals(currentPage, 'tech-tree')} ? 'active' : ''">Tech</a>
            <a th:href="@{/events}" th:classappend="${#strings.equals(currentPage, 'events')} ? 'active' : ''">Events</a>
            <a th:href="@{/voxtex}" th:classappend="${#strings.equals(currentPage, 'voxtex')} ? 'active' : ''">Voxtex</a>
            <a th:href="@{/simulation}" th:classappend="${#strings.equals(currentPage, 'simulation')} ? 'active' : ''">Cortex</a>
        </div>
    </nav>

    <main class="main-content">
        <div th:replace="~{${viewName} :: content}">Content goes here</div>
    </main>

    <footer class="footer glass-morphism">
        <p>&copy; 2026 CIVILIZATION OPERATING SYSTEM — SCIENTIFIC GOVERNANCE FOR PLANETARY STABILITY</p>
    </footer>
    <script>
        lucide.createIcons();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('SW registered'))
                .catch(e => console.log('SW failed:', e));
        }
        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.body.classList.add('pwa-mode');
        }
    </script>
</body>
</html>
