<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Civilization Operating System — A Resource-Based Economy Platform">
    <title th:text="'Civilization OS | ' + ${pageTitle ?: 'Dashboard'}">Civilization OS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/auth.js}"></script>
</head>
<body>
    <nav class="nav-bar glass-morphism">
        <div class="nav-brand-group">
            <img th:src="@{/images/logo.svg}" alt="Logo" class="logo-small">
            <a th:href="@{/}" class="nav-brand glow-text">CIV:OS</a>
        </div>
        <div class="nav-links">
            <a th:href="@{/}" th:classappend="${#strings.equals(currentPage, 'dashboard')} ? 'active' : ''">Dashboard</a>
            <a th:href="@{/play}" th:classappend="${#strings.equals(currentPage, 'play')} ? 'active' : ''">Map</a>
            <a th:href="@{/civilizations}" th:classappend="${#strings.equals(currentPage, 'civilizations')} ? 'active' : ''">Civilizations</a>
            <a th:href="@{/leaderboard}" th:classappend="${#strings.equals(currentPage, 'leaderboard')} ? 'active' : ''">Leaderboard</a>
            <a th:href="@{/trade}" th:classappend="${#strings.equals(currentPage, 'trade')} ? 'active' : ''">Trade</a>
            <a th:href="@{/tech-tree}" th:classappend="${#strings.equals(currentPage, 'tech-tree')} ? 'active' : ''">Tech</a>
            <a th:href="@{/events}" th:classappend="${#strings.equals(currentPage, 'events')} ? 'active' : ''">Events</a>
            <a th:href="@{/nexus}" th:classappend="${#strings.equals(currentPage, 'nexus')} ? 'active' : ''">nexus</a>
            <a th:href="@{/simulation}" th:classappend="${#strings.equals(currentPage, 'simulation')} ? 'active' : ''">Cortex</a>
            <a th:href="@{/network-map}" th:classappend="${#strings.equals(currentPage, 'network-map')} ? 'active' : ''">Network Map</a>
            <a th:href="@{/network}" th:classappend="${#strings.equals(currentPage, 'network')} ? 'active' : ''">Global Dashboard</a>
        </div>
        <div class="nav-user-status" id="navUserStatus" style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
            <div id="citizenBadge" class="badge badge-unassigned" style="font-size: 0.8rem; letter-spacing: 1px; font-weight: bold; border: 1px solid rgba(0,242,255,0.3); background: rgba(0,242,255,0.05); color: #00f2ff; padding: 4px 10px; border-radius: 4px; display: none;">
                <span class="pulse-indicator" style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#00f2ff; margin-right:6px; box-shadow:0 0 6px #00f2ff; animation: pulse 2s infinite;"></span>
                <span id="citizenName">Loading...</span>&nbsp;<span id="citizenRole" style="opacity:0.7; font-size:0.75rem;"></span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div th:replace="~{${viewName} :: content}">Content goes here</div>
    </main>

    <footer class="footer glass-morphism">
        <p>&copy; 2026 CIVILIZATION OPERATING SYSTEM — SCIENTIFIC GOVERNANCE FOR PLANETARY STABILITY</p>
    </footer>
    <script>
        lucide.createIcons();
    </script>
    <script>
        async function updateNavUserStatus() {
            let token = localStorage.getItem('civos_token');
            if (!token) {
                try {
                    let resp = await fetch('/api/v1/auth/connect', { method: 'POST' });
                    let data = await resp.json();
                    token = data.token;
                    localStorage.setItem('civos_token', token);
                    localStorage.setItem('civos_clientId', data.clientId);
                } catch(e) {
                    console.warn('Authentication unavailable');
                    return;
                }
            }

            try {
                let resp = await fetch('/api/v1/civilizations/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.ok) {
                    let data = await resp.json();
                    document.getElementById('citizenName').textContent = data.name;
                    document.getElementById('citizenRole').textContent = data.role ? `[${data.role}]` : '[VISITOR]';
                    const badge = document.getElementById('citizenBadge');
                    badge.style.display = 'inline-flex';
                    badge.style.alignItems = 'center';
                    
                    if (data.role === 'FOUNDER') {
                        badge.style.borderColor = 'rgba(255, 215, 0, 0.4)';
                        badge.style.color = '#ffd700';
                        badge.querySelector('.pulse-indicator').style.background = '#ffd700';
                        badge.querySelector('.pulse-indicator').style.boxShadow = '0 0 6px #ffd700';
                    } else if (data.role === 'SECTOR_DELEGATE') {
                        badge.style.borderColor = 'rgba(0, 255, 136, 0.4)';
                        badge.style.color = '#00ff88';
                        badge.querySelector('.pulse-indicator').style.background = '#00ff88';
                        badge.querySelector('.pulse-indicator').style.boxShadow = '0 0 6px #00ff88';
                    } else if (data.role === 'NEXUS_COORDINATOR') {
                        badge.style.borderColor = 'rgba(170, 102, 255, 0.4)';
                        badge.style.color = '#aa66ff';
                        badge.querySelector('.pulse-indicator').style.background = '#aa66ff';
                        badge.querySelector('.pulse-indicator').style.boxShadow = '0 0 6px #aa66ff';
                    }
                }
            } catch (e) {
                console.warn('Failed to load citizen details', e);
            }
        }
        updateNavUserStatus();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('SW registered'))
                .catch(e => console.log('SW failed:', e));
        }
        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.body.classList.add('pwa-mode');
        }
    </script>
</body>
</html>
