<div th:fragment="content">
    <header class="page-header">
        <h1 class="glow-text"><i data-lucide="line-chart" style="width: 48px; height: 48px; vertical-align: middle; margin-right: 15px;"></i>System Strategy</h1>
        <p class="subtitle">Resource Management & Balance | Dynamic Logic Analysis</p>
    </header>
    <section class="card glass-morphism animate" th:if="${balance != null && !balance.isEmpty()}">
        <h2><i data-lucide="pie-chart" style="width: 18px; vertical-align: middle;"></i> Logic Analysis</h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Category</th><th>Supply</th><th>Demand</th><th>Delta</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="b : ${balance}">
                        <td th:text="${b.category}">—</td>
                        <td th:text="${#numbers.formatDecimal(b.supply, 0, 1)}">0</td>
                        <td th:text="${#numbers.formatDecimal(b.demand, 0, 1)}">0</td>
                        <td><span class="badge" th:classappend="${b.supply >= b.demand ? 'badge-active' : 'badge-critical'}" th:text="${#numbers.formatDecimal(b.supply - b.demand, 0, 1)}">0</span></td>
                        <td><span class="badge" th:classappend="${b.status == 'STABLE' ? 'badge-active' : 'badge-critical'}" th:text="${b.status}">—</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
