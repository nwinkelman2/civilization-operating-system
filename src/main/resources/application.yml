civilization:
  scale: ${CIVILIZATION_SCALE:LOCAL}

spring:
  application:
    name: civilization-os

  datasource:
    url: jdbc:postgresql://localhost:5432/openciv
    username: postgres
    password: postgres

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true

server:
  port: ${PORT:8080}

game:
  events:
    enabled: true
    tick-rate-ms: 30000
  trade:
    max-active: 10
    auto-resolve-days: 7
